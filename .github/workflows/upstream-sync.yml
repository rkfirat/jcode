name: upstream-sync

# Keep master identical to 1jehuang/jcode and replay our patches (branch
# tuna/at-dosya) on top. Conflicts open an issue instead of force-pushing.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tuna/at-dosya
      - name: Rebase onto upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tuna-bot"
          git config user.email "tuna-bot@users.noreply.github.com"
          git remote add upstream https://github.com/1jehuang/jcode.git
          git fetch upstream master
          git push origin upstream/master:refs/heads/master --force
          if git rebase upstream/master; then
            git push origin HEAD:tuna/at-dosya --force-with-lease
          else
            git rebase --abort
            gh issue create --title "upstream-sync: rebase conflict $(date -u +%F)" \
              --body "tuna/at-dosya upstream/master üstüne otomatik oturmadı. Elle rebase gerekiyor."
            exit 1
          fi
